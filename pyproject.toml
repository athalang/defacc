[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "libclang>=18.1.1",
    "litellm>=1.0.0",
    "pydantic-settings>=2.0.0",
    "networkx>=3.4.2",
    "typer>=0.25.1",
]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*"]
exclude = ["tests*"]
